<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a1b">
<title>オートワールド - 開拓と自動化</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#10160f;
    font-family:-apple-system,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; color:#eef2e9; }
  #game { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }

  /* top resource strip */
  #topbar { position:fixed; top:0; left:0; right:0; padding-top:max(6px,env(safe-area-inset-top));
    background:linear-gradient(#0009,#0000); pointer-events:none; }
  #clock { font-size:12px; font-weight:700; text-shadow:0 1px 2px #000; padding:2px 10px; display:flex; justify-content:space-between; }
  #resStrip { display:flex; gap:6px; overflow-x:auto; padding:4px 8px 7px; -webkit-overflow-scrolling:touch; pointer-events:auto; }
  #resStrip::-webkit-scrollbar{display:none;}
  .res { flex:0 0 auto; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.13); border-radius:8px;
    padding:3px 8px; font-size:12px; font-weight:700; white-space:nowrap; text-shadow:0 1px 2px #000; }
  .res .v { color:#ffe27a; }

  /* controls */
  #joyBase{position:fixed;pointer-events:none;width:120px;height:120px;border-radius:50%;border:2px solid #fff3;background:#fff1;display:none;}
  #joyKnob{position:fixed;pointer-events:none;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffd,#aab8);display:none;}
  .cbtn{position:fixed;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;
    font-weight:800;color:#fff;text-shadow:0 1px 3px #000;border:2px solid #fff4;box-shadow:0 4px 14px #0007;}
  .cbtn:active{transform:scale(.93);filter:brightness(1.15);}
  #gatherBtn{right:24px;bottom:calc(36px + env(safe-area-inset-bottom));width:96px;height:96px;font-size:15px;
    background:radial-gradient(circle at 35% 30%,#e0a44a,#8a5a1c);}
  #buildBtn{right:132px;bottom:calc(44px + env(safe-area-inset-bottom));width:70px;height:70px;font-size:24px;
    background:radial-gradient(circle at 35% 30%,#5aa0e0,#27568a);}
  .cbtn.disabled{opacity:.4;filter:grayscale(.6);}

  /* placement bar */
  #placeBar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    background:#0b140bdd;border-top:1px solid #fff2;display:none;flex-direction:column;gap:8px;z-index:30;}
  #placeBar .hint{font-size:13px;text-align:center;color:#cfe0c0;}
  #placeBar .row{display:flex;gap:10px;}
  #placeBar button{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:800;}
  #placeCancel{background:#7f3b3b;color:#fff;}
  #placeName{font-weight:800;text-align:center;font-size:15px;}

  /* build panel */
  #buildPanel{position:fixed;inset:0;background:#0b120ae8;z-index:40;display:none;flex-direction:column;
    padding:max(14px,env(safe-area-inset-top)) 12px 14px;}
  #buildPanel h2{text-align:center;font-size:19px;margin-bottom:8px;}
  .tabs{display:flex;gap:8px;margin-bottom:10px;}
  .tab{flex:1;padding:10px;text-align:center;background:#1c2a1a;border:1px solid #fff2;border-radius:9px;font-weight:800;font-size:14px;}
  .tab.on{background:#3a6b2f;border-color:#7fd06a;}
  #cardList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;}
  .card{background:#16210f;border:1px solid #fff2;border-left:4px solid #6aa84f;border-radius:10px;padding:10px 12px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .card .l .nm{font-size:15px;font-weight:800;}
  .card .l .ds{font-size:11px;color:#a9c098;margin-top:2px;}
  .card .l .cost{font-size:12px;margin-top:4px;color:#d7e6c8;}
  .card .l .cost .bad{color:#e88;}
  .card button{background:#4f8b35;color:#fff;border:none;border-radius:9px;padding:11px 15px;font-size:13px;font-weight:800;flex:0 0 auto;}
  .card button:disabled{background:#3a4733;color:#889;}
  .card.done{border-left-color:#f1c40f;}
  #panelClose{margin-top:10px;align-self:center;background:#46613a;color:#fff;border:none;border-radius:10px;padding:11px 30px;font-size:15px;font-weight:800;}

  /* generic overlay */
  .overlay{position:fixed;inset:0;background:#08100be8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;gap:16px;z-index:60;}
  .overlay h1{font-size:30px;}
  .overlay p{font-size:14px;line-height:1.7;color:#bcd0ac;max-width:340px;}
  .bigbtn{background:linear-gradient(135deg,#5aa0e0,#2c6b3e);color:#fff;border:none;padding:15px 40px;font-size:17px;font-weight:800;
    border-radius:12px;box-shadow:0 4px 14px #0007;letter-spacing:1px;}
  .bigbtn:active{transform:scale(.96);}
  .smallbtn{background:#46613a;color:#fff;border:none;padding:10px 22px;font-size:13px;font-weight:700;border-radius:10px;}

  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000b;border:1px solid #fff3;
    padding:9px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:50;opacity:0;transition:opacity .3s;
    pointer-events:none;max-width:86%;text-align:center;}
  #toast.show{opacity:1;}

  /* building info popup */
  #infoPop{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#13200edd;border:1px solid #fff3;border-radius:12px;padding:12px 16px;z-index:35;display:none;
    min-width:200px;text-align:center;}
  #infoPop .t{font-weight:800;font-size:15px;margin-bottom:4px;}
  #infoPop .s{font-size:12px;color:#bcd0ac;margin-bottom:10px;}
  #infoPop .row{display:flex;gap:8px;}
  #infoPop button{flex:1;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:800;}
  #infoRemove{background:#8a3b3b;color:#fff;} #infoClose{background:#46613a;color:#fff;}
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>

<div id="topbar">
  <div id="clock"><span id="dayLabel">1日目</span><span id="phaseLabel">☀️ 昼</span></div>
  <div id="resStrip"></div>
</div>

<div id="joyBase"></div><div id="joyKnob"></div>
<div id="buildBtn" class="cbtn">🔨</div>
<div id="gatherBtn" class="cbtn">採取</div>

<div id="placeBar">
  <div id="placeName"></div>
  <div class="hint" id="placeHint">設置する場所をタップ</div>
  <div class="row"><button id="placeCancel">キャンセル</button></div>
</div>

<div id="infoPop">
  <div class="t" id="infoTitle"></div>
  <div class="s" id="infoStat"></div>
  <div class="row"><button id="infoRemove">撤去(半額返却)</button><button id="infoClose">閉じる</button></div>
</div>

<div id="buildPanel">
  <h2>🏭 建設 & クラフト</h2>
  <div class="tabs">
    <div class="tab on" data-tab="build">⚙️ 設備</div>
    <div class="tab" data-tab="craft">🛠️ クラフト</div>
  </div>
  <div id="cardList"></div>
  <button id="panelClose">閉じる</button>
</div>

<div id="toast"></div>

<div id="titleScreen" class="overlay">
  <div style="font-size:46px">🌍⛏️🏭</div>
  <h1>オートワールド</h1>
  <p>広大な大地を探索し、資源を採取。<br>採掘機や工場を建てて<b>生産を自動化</b>し、<br>最後は<b>ロケット</b>を組み立てて飛び立とう。</p>
  <button class="bigbtn" id="startBtn">開拓を始める</button>
  <button class="smallbtn" id="continueBtn" style="display:none">続きから</button>
  <p style="font-size:12px;color:#889">左半分ドラッグで移動 / 右下「採取」 / 🔨で建設</p>
</div>

<div id="winScreen" class="overlay" style="display:none">
  <div style="font-size:46px">🚀✨</div>
  <h1>発射成功！</h1>
  <p id="winStat"></p>
  <button class="bigbtn" id="winContinue">探索を続ける</button>
  <button class="smallbtn" id="winReset">新しい世界で最初から</button>
</div>

<script>
(() => {
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const TILE=44;
let DPR=Math.min(devicePixelRatio||1,2), VW=0, VH=0;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); VW=innerWidth; VH=innerHeight;
  cv.width=Math.floor(VW*DPR); cv.height=Math.floor(VH*DPR); cv.style.width=VW+'px'; cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v), dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const $=id=>document.getElementById(id);

// ---------- data ----------
const RES={
  wood:{n:'木材',e:'🪵'}, stone:{n:'石',e:'🪨'}, coal:{n:'石炭',e:'⚫'},
  iron_ore:{n:'鉄鉱石',e:'🟤'}, copper_ore:{n:'銅鉱石',e:'🟠'},
  iron_plate:{n:'鉄板',e:'🔩'}, copper_plate:{n:'銅板',e:'🟧'},
  gear:{n:'歯車',e:'⚙️'}, circuit:{n:'回路',e:'🔌'},
};
const RES_ORDER=['wood','stone','coal','iron_ore','copper_ore','iron_plate','copper_plate','gear','circuit'];

const NODE={
  tree:  {res:'wood',     max:40, respawn:22, draw:'tree'},
  rock:  {res:'stone',    max:70, respawn:30, draw:'rock'},
  coal:  {res:'coal',     max:55, respawn:38, draw:'ore', color:'#3a3a3a', spot:'#000'},
  iron:  {res:'iron_ore', max:55, respawn:42, draw:'ore', color:'#8a99a8', spot:'#cdd6df'},
  copper:{res:'copper_ore',max:55,respawn:42, draw:'ore', color:'#a86b3c', spot:'#e08a4a'},
};

const BUILD=[
  {key:'miner',  name:'採掘機',   e:'⛏️', place:'node', cost:{wood:5,stone:5}, interval:1.6, color:'#c9943f',
    ds:'資源ノードに設置→自動で採掘'},
  {key:'furnace',name:'製錬炉',   e:'🔥', place:'ground', cost:{stone:12}, interval:2.0, color:'#d35400',
    recipe:{in:{iron_ore:1,coal:1}, out:{iron_plate:1}}, ds:'鉄鉱石+石炭→鉄板'},
  {key:'cfurnace',name:'銅製錬炉',e:'🟥', place:'ground', cost:{stone:12}, interval:2.0, color:'#a04020',
    recipe:{in:{copper_ore:1,coal:1}, out:{copper_plate:1}}, ds:'銅鉱石+石炭→銅板'},
  {key:'gearp',  name:'歯車工場', e:'⚙️', place:'ground', cost:{stone:10,iron_plate:5}, interval:2.4, color:'#7f8c8d',
    recipe:{in:{iron_plate:2}, out:{gear:1}}, ds:'鉄板2→歯車'},
  {key:'circ',   name:'回路工場', e:'🔌', place:'ground', cost:{stone:10,iron_plate:5}, interval:3.0, color:'#27ae60',
    recipe:{in:{copper_plate:1,iron_plate:1}, out:{circuit:1}}, ds:'銅板+鉄板→回路'},
  {key:'store',  name:'倉庫',     e:'📦', place:'ground', cost:{wood:10,stone:5}, color:'#8d6e63',
    ds:'資源の保管上限+300', passive:'storage'},
];
const BUILD_BY=Object.fromEntries(BUILD.map(b=>[b.key,b]));

const CRAFT=[
  {key:'stone_pick',name:'石のツルハシ',e:'⛏️',cost:{wood:10,stone:10},ds:'採取量 2倍',apply:()=>{S.tier=Math.max(S.tier,2);}},
  {key:'iron_pick', name:'鉄のツルハシ',e:'⛏️',cost:{iron_plate:15},ds:'採取量 3倍',req:()=>S.tier>=2,apply:()=>{S.tier=Math.max(S.tier,3);}},
  {key:'rocket',    name:'🚀 ロケット建造',e:'🚀',cost:{gear:30,circuit:30,iron_plate:50,copper_plate:20},ds:'これが最終目標！発射でクリア',apply:()=>winGame()},
];

// ---------- state ----------
let S=null; // save-able state
function freshState(seed){
  return { seed:seed, time:60, px:0, py:0, tier:1,
    inv:{}, nodes:{}, builds:{}, crafted:{}, won:false };
}
const G={ run:false, cam:{x:0,y:0}, last:0, joy:{active:false,id:null,bx:0,by:0,dx:0,dy:0,mag:0},
  keys:{}, floaters:[], particles:[], placeKey:null, gatherCd:0, selBuild:null };

const cap=()=> 200 + 300*Object.values(S.builds).filter(b=>b.key==='store').length;
const invAmt=k=> S.inv[k]||0;
function addInv(k,n){ const c=cap(); const cur=invAmt(k); const room=c-cur; const add=Math.min(n,room);
  if(add>0) S.inv[k]=cur+add; return add; }
function hasCost(cost){ for(const k in cost) if(invAmt(k)<cost[k]) return false; return true; }
function payCost(cost){ for(const k in cost) S.inv[k]-=cost[k]; }

// ---------- noise / world ----------
function hash2(x,y,s){ let h=x*374761393 + y*668265263 + s*982451653; h=(h^(h>>13))*1274126177; h^=h>>16; return (h>>>0)/4294967296; }
function vnoise(x,y,s){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y,s){ let t=0,amp=.6,f=1; for(let i=0;i<3;i++){ t+=vnoise(x*f,y*f,s+i*53)*amp; amp*=.5; f*=2; } return t; }
function biomeAt(tx,ty){
  const e=fbm(tx*0.06, ty*0.06, S.seed);
  const m=fbm(tx*0.05+40, ty*0.05+40, S.seed+9);
  if(e<0.33) return {t:'water', e, m};
  if(e<0.38) return {t:'sand', e, m};
  if(e>0.70) return {t:'rock', e, m};
  return {t:m>0.5?'forest':'grass', e, m};
}
const WORLD=130;
function nodeKey(tx,ty){ return tx+','+ty; }
function genWorld(){
  S.nodes={};
  for(let ty=0;ty<WORLD;ty++) for(let tx=0;tx<WORLD;tx++){
    const b=biomeAt(tx,ty); const r=hash2(tx,ty,S.seed+777); const r2=hash2(tx,ty,S.seed+1313);
    let type=null;
    if(b.t==='forest'){ if(r<0.34) type='tree'; else if(r<0.37) type='rock'; }
    else if(b.t==='grass'){ if(r<0.10) type='tree'; else if(r<0.13) type='rock'; }
    else if(b.t==='rock'){
      if(r2<0.10) type='iron'; else if(r2<0.19) type='copper'; else if(r2<0.30) type='coal'; else if(r<0.55) type='rock';
    }
    if(type){ const d=NODE[type]; S.nodes[nodeKey(tx,ty)]={type, amount:d.max}; }
  }
  // spawn: find grass/forest near center with nearby resources
  let cx=WORLD>>1, cy=WORLD>>1;
  for(let rad=0;rad<30;rad++){ let found=false;
    for(let dy=-rad;dy<=rad&&!found;dy++)for(let dx=-rad;dx<=rad&&!found;dx++){
      const tx=cx+dx,ty=cy+dy,b=biomeAt(tx,ty);
      if(b.t==='grass'||b.t==='forest'){ cx=tx;cy=ty;found=true; } }
    if(found)break; }
  S.px=cx*TILE+TILE/2; S.py=cy*TILE+TILE/2;
  // guarantee starter trees & stone around spawn
  let ensured={tree:0,rock:0};
  for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
    const tx=cx+dx,ty=cy+dy,k=nodeKey(tx,ty);
    if((dx||dy) && !S.nodes[k] && biomeAt(tx,ty).t!=='water'){
      if(ensured.tree<5){ S.nodes[k]={type:'tree',amount:NODE.tree.max}; ensured.tree++; }
      else if(ensured.rock<4){ S.nodes[k]={type:'rock',amount:NODE.rock.max}; ensured.rock++; }
    }
  }
}
function tileSolid(tx,ty){
  if(tx<0||ty<0||tx>=WORLD||ty>=WORLD) return true;
  if(biomeAt(tx,ty).t==='water') return true;
  if(S.builds[nodeKey(tx,ty)]) return true;
  return false;
}
function moveEnt(e,dx,dy){
  const r=e.r;
  let nx=e.x+dx;
  if(!tileSolid((nx+Math.sign(dx)*r)/TILE|0,(e.y+r*0.6)/TILE|0) && !tileSolid((nx+Math.sign(dx)*r)/TILE|0,(e.y-r*0.6)/TILE|0)) e.x=nx;
  let ny=e.y+dy;
  if(!tileSolid((e.x+r*0.6)/TILE|0,(ny+Math.sign(dy)*r)/TILE|0) && !tileSolid((e.x-r*0.6)/TILE|0,(ny+Math.sign(dy)*r)/TILE|0)) e.y=ny;
}

// ---------- save / load ----------
const SAVE_KEY='autoworld_save_v1';
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(SAVE_KEY); if(!s)return null; return JSON.parse(s);}catch(e){return null;} }
let autosaveT=0;

// ---------- effects ----------
function floater(x,y,txt,c){ G.floaters.push({x,y,txt,c,life:1,vy:-30}); }
function burst(x,y,c,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=rnd(30,120);
  G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.3,.6),c,r:rnd(2,4)}); } }
let toastT=null;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1700); }

// ---------- gather ----------
function nearestNode(){ let best=null,bd=1e9;
  const ptx=S.px/TILE|0, pty=S.py/TILE|0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const tx=ptx+dx,ty=pty+dy,k=nodeKey(tx,ty),nd=S.nodes[k];
    if(nd && nd.amount>0){ const cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2,d=dist(S.px,S.py,cx,cy);
      if(d<TILE*2 && d<bd){ bd=d; best={k,nd,cx,cy}; } }
  }
  return best;
}
function doGather(){
  if(G.gatherCd>0) return; G.gatherCd=0.38;
  const t=nearestNode(); if(!t){ return; }
  const def=NODE[t.nd.type], yield_=Math.min(S.tier, t.nd.amount);
  const got=addInv(def.res, yield_);
  if(got<=0){ floater(t.cx,t.cy-20,'倉庫満杯','#e88'); return; }
  t.nd.amount-=yield_;
  burst(t.cx,t.cy,'#fff',5);
  floater(t.cx,t.cy-20,'+'+got+RES[def.res].e,'#ffe27a');
  if(t.nd.amount<=0){ t.nd.respawnAt=S.time+def.respawn; }
  renderRes();
}

// ---------- machine tick ----------
function machineTick(dt){
  for(const k in S.builds){
    const b=S.builds[k]; const def=BUILD_BY[b.key];
    if(def.passive) continue;
    if(b.t===undefined) b.t=0;
    b.t+=dt;
    if(b.t<def.interval) continue;
    if(def.place==='node'){
      const nd=S.nodes[k]; // miner sits on node tile
      if(nd && nd.amount>0){
        const res=NODE[nd.type].res;
        if(invAmt(res)<cap()){ addInv(res,1); nd.amount--; b.t=0; b.active=true;
          if(nd.amount<=0) nd.respawnAt=S.time+NODE[nd.type].respawn; }
        else { b.t=def.interval; b.active=false; }
      } else { b.t=def.interval; b.active=false; }
    } else if(def.recipe){
      const rc=def.recipe;
      let ok=true; for(const i in rc.in) if(invAmt(i)<rc.in[i]) ok=false;
      for(const o in rc.out) if(invAmt(o)>=cap()) ok=false;
      if(ok){ for(const i in rc.in) S.inv[i]-=rc.in[i]; for(const o in rc.out) addInv(o,rc.out[o]); b.t=0; b.active=true; }
      else { b.t=def.interval; b.active=false; }
    }
  }
}
function nodeRespawnTick(){
  for(const k in S.nodes){ const nd=S.nodes[k];
    if(nd.amount<=0 && nd.respawnAt!=null && S.time>=nd.respawnAt){ nd.amount=NODE[nd.type].max; nd.respawnAt=null; } }
}

// ---------- build / place ----------
function enterPlace(key){
  const def=BUILD_BY[key];
  if(!hasCost(def.cost)){ toast('資材が足りません'); return; }
  G.placeKey=key; closePanel();
  $('placeName').textContent=def.e+' '+def.name+' を設置';
  $('placeHint').textContent= def.place==='node' ? '資源ノードをタップ' : '空き地をタップ';
  $('placeBar').style.display='flex';
}
function cancelPlace(){ G.placeKey=null; $('placeBar').style.display='none'; }
function tryPlaceAt(wx,wy){
  if(!G.placeKey) return;
  const def=BUILD_BY[G.placeKey];
  const tx=wx/TILE|0, ty=wy/TILE|0, k=nodeKey(tx,ty);
  if(tx<0||ty<0||tx>=WORLD||ty>=WORLD) return;
  if(S.builds[k]){ toast('すでに何か建っています'); return; }
  const b=biomeAt(tx,ty);
  if(def.place==='node'){
    if(!S.nodes[k]){ toast('資源ノードの上に設置してください'); return; }
  } else {
    if(b.t==='water'){ toast('水上には建てられません'); return; }
    if(S.nodes[k]){ toast('資源ノードの上には建てられません'); return; }
  }
  if(!hasCost(def.cost)){ toast('資材不足'); cancelPlace(); return; }
  payCost(def.cost);
  S.builds[k]={key:G.placeKey, t:0};
  burst(tx*TILE+TILE/2,ty*TILE+TILE/2,def.color,12);
  toast(def.name+' を設置');
  renderRes();
  if(!hasCost(def.cost)) cancelPlace(); // out of resources -> exit
}

// ---------- crafting ----------
function doCraft(c){
  if(c.req && !c.req()){ toast('前提条件を満たしていません'); return; }
  if(c.crafted && S.crafted[c.key]){ toast('作成済みです'); return; }
  if(!hasCost(c.cost)){ toast('資材が足りません'); return; }
  payCost(c.cost); S.crafted[c.key]=true; c.apply();
  toast(c.name+' 完成！'); renderRes(); buildPanelRender();
}

// ---------- win ----------
function winGame(){ S.won=true; save();
  $('winStat').innerHTML=`${S.seed%100000} の世界 / ${Math.floor(S.time/120)+1}日目に発射！`;
  $('winScreen').style.display='flex'; }

// ---------- input ----------
const joyBase=$('joyBase'), joyKnob=$('joyKnob'), J=G.joy;
function startJoy(t){ J.active=true; J.id=t.identifier; J.bx=t.clientX; J.by=t.clientY; J.dx=0;J.dy=0;J.mag=0;
  joyBase.style.display='block'; joyKnob.style.display='block';
  joyBase.style.left=(t.clientX-60)+'px'; joyBase.style.top=(t.clientY-60)+'px';
  joyKnob.style.left=(t.clientX-27)+'px'; joyKnob.style.top=(t.clientY-27)+'px'; }
function moveJoy(t){ let dx=t.clientX-J.bx,dy=t.clientY-J.by,m=Math.hypot(dx,dy),mx=48;
  if(m>mx){dx=dx/m*mx;dy=dy/m*mx;} J.dx=dx/mx; J.dy=dy/mx; J.mag=Math.min(m/mx,1);
  joyKnob.style.left=(J.bx+dx-27)+'px'; joyKnob.style.top=(J.by+dy-27)+'px'; }
function endJoy(){ J.active=false;J.id=null;J.dx=0;J.dy=0;J.mag=0; joyBase.style.display='none'; joyKnob.style.display='none'; }

const taps=new Map();
cv.addEventListener('touchstart',e=>{ for(const t of e.changedTouches){
    taps.set(t.identifier,{x:t.clientX,y:t.clientY,t:performance.now(),moved:0});
    if(t.clientX<VW*0.5 && !J.active && !G.placeKey) startJoy(t);
  }},{passive:true});
cv.addEventListener('touchmove',e=>{ for(const t of e.changedTouches){
    const tp=taps.get(t.identifier); if(tp) tp.moved+=Math.abs(t.clientX-tp.x)+Math.abs(t.clientY-tp.y);
    if(t.identifier===J.id) moveJoy(t);
  }},{passive:true});
cv.addEventListener('touchend',e=>{ for(const t of e.changedTouches){
    const tp=taps.get(t.identifier); taps.delete(t.identifier);
    if(t.identifier===J.id){ endJoy(); }
    else if(tp && (performance.now()-tp.t)<350 && tp.moved<14) handleTap(t.clientX,t.clientY);
  }},{passive:true});
cv.addEventListener('touchcancel',e=>{ for(const t of e.changedTouches){ taps.delete(t.identifier); if(t.identifier===J.id) endJoy(); }},{passive:true});

// mouse fallback
let md=false, mdInfo=null;
cv.addEventListener('mousedown',e=>{ md=true; mdInfo={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};
  if(e.clientX<VW*0.5 && !G.placeKey) startJoy({identifier:'m',clientX:e.clientX,clientY:e.clientY}); });
addEventListener('mousemove',e=>{ if(!md)return; if(mdInfo) mdInfo.moved+=Math.abs(e.movementX)+Math.abs(e.movementY);
  if(J.id==='m') moveJoy({clientX:e.clientX,clientY:e.clientY}); });
addEventListener('mouseup',e=>{ if(!md)return; md=false;
  if(J.id==='m'){ endJoy(); } else if(mdInfo && performance.now()-mdInfo.t<350 && mdInfo.moved<14) handleTap(e.clientX,e.clientY); });

function handleTap(sx,sy){
  const wx=sx+G.cam.x, wy=sy+G.cam.y;
  if(G.placeKey){ tryPlaceAt(wx,wy); return; }
  // tap on building -> info
  const tx=wx/TILE|0, ty=wy/TILE|0, k=nodeKey(tx,ty);
  if(S.builds[k]){ openInfo(k); }
}

// keyboard (desktop)
addEventListener('keydown',e=>{ G.keys[e.key.toLowerCase()]=true; if(e.key===' '){e.preventDefault();doGather();} });
addEventListener('keyup',e=>{ G.keys[e.key.toLowerCase()]=false; });

$('gatherBtn').addEventListener('touchstart',e=>{e.preventDefault();doGather();},{passive:false});
$('gatherBtn').addEventListener('mousedown',e=>{e.preventDefault();doGather();});
$('buildBtn').onclick=openPanel;
$('placeCancel').onclick=cancelPlace;

// ---------- building info popup ----------
function openInfo(k){ G.selBuild=k; const b=S.builds[k], def=BUILD_BY[b.key];
  $('infoTitle').textContent=def.e+' '+def.name;
  let stat=def.ds;
  if(def.place==='node'){ const nd=S.nodes[k]; stat= nd? `採掘中: ${RES[NODE[nd.type].res].n} (残${nd.amount})` : '対象ノードなし'; }
  else if(def.recipe){ stat=def.ds; }
  $('infoStat').textContent=stat;
  $('infoPop').style.display='block'; }
$('infoClose').onclick=()=>{ $('infoPop').style.display='none'; G.selBuild=null; };
$('infoRemove').onclick=()=>{ const k=G.selBuild; if(!k)return; const b=S.builds[k],def=BUILD_BY[b.key];
  for(const r in def.cost) addInv(r, Math.floor(def.cost[r]/2));
  delete S.builds[k]; $('infoPop').style.display='none'; G.selBuild=null; renderRes(); toast('撤去しました'); };

// ---------- build panel ----------
let curTab='build';
function openPanel(){ if(!G.run)return; cancelPlace(); buildPanelRender(); $('buildPanel').style.display='flex'; }
function closePanel(){ $('buildPanel').style.display='none'; }
$('panelClose').onclick=closePanel;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ curTab=t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); buildPanelRender(); });
function costStr(cost){ return Object.keys(cost).map(k=>{ const ok=invAmt(k)>=cost[k];
  return `<span class="${ok?'':'bad'}">${RES[k].e}${cost[k]}</span>`; }).join(' '); }
function buildPanelRender(){
  const list=$('cardList'); list.innerHTML='';
  if(curTab==='build'){
    BUILD.forEach(def=>{
      const cnt=Object.values(S.builds).filter(b=>b.key===def.key).length;
      const card=document.createElement('div'); card.className='card';
      card.innerHTML=`<div class="l"><div class="nm">${def.e} ${def.name} ${cnt?`<span style="color:#9c9">×${cnt}</span>`:''}</div>
        <div class="ds">${def.ds}</div><div class="cost">${costStr(def.cost)}</div></div>`;
      const btn=document.createElement('button'); btn.textContent='設置';
      btn.disabled=!hasCost(def.cost); btn.onclick=()=>enterPlace(def.key);
      card.appendChild(btn); list.appendChild(card);
    });
  } else {
    CRAFT.forEach(c=>{
      const made=c.crafted&&S.crafted[c.key];
      const isPick=c.key.indexOf('pick')>=0;
      const owned= isPick ? (c.key==='stone_pick'?S.tier>=2:S.tier>=3) : made;
      const card=document.createElement('div'); card.className='card'+(owned?' done':'');
      card.innerHTML=`<div class="l"><div class="nm">${c.e} ${c.name}</div><div class="ds">${c.ds}</div>
        <div class="cost">${costStr(c.cost)}</div></div>`;
      const btn=document.createElement('button');
      if(owned){ btn.textContent='✔'; btn.disabled=true; }
      else { btn.textContent='作成'; btn.disabled=!hasCost(c.cost)||(c.req&&!c.req()); btn.onclick=()=>doCraft(c); }
      card.appendChild(btn); list.appendChild(card);
    });
  }
}

// ---------- HUD ----------
function renderRes(){
  const strip=$('resStrip'); let html='';
  const c=cap();
  RES_ORDER.forEach(k=>{ const v=invAmt(k); if(v>0||['wood','stone'].includes(k))
    html+=`<span class="res">${RES[k].e}<span class="v"> ${v}</span></span>`; });
  html+=`<span class="res" style="opacity:.7">📦上限 ${c}</span>`;
  strip.innerHTML=html;
}

// ---------- loop ----------
function loop(now){ if(!G.run) return;
  let dt=(now-G.last)/1000; G.last=now; if(dt>0.05)dt=0.05;
  update(dt); render(); requestAnimationFrame(loop); }

function update(dt){
  S.time+=dt;
  // move
  let mx=J.dx*J.mag, my=J.dy*J.mag;
  if(G.keys['a']||G.keys['arrowleft'])mx-=1; if(G.keys['d']||G.keys['arrowright'])mx+=1;
  if(G.keys['w']||G.keys['arrowup'])my-=1; if(G.keys['s']||G.keys['arrowdown'])my+=1;
  const m=Math.hypot(mx,my);
  const P={x:S.px,y:S.py,r:13};
  if(m>0.05){ moveEnt(P, mx/m*170*Math.min(m,1)*dt, my/m*170*Math.min(m,1)*dt); S.px=P.x; S.py=P.y; }
  if(G.gatherCd>0) G.gatherCd-=dt;
  machineTick(dt); nodeRespawnTick();
  // effects
  for(let i=G.particles.length-1;i>=0;i--){ const p=G.particles[i]; p.life-=dt; p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9; if(p.life<=0)G.particles.splice(i,1); }
  for(let i=G.floaters.length-1;i>=0;i--){ const f=G.floaters[i]; f.life-=dt; f.y+=f.vy*dt; f.vy*=.93; if(f.life<=0)G.floaters.splice(i,1); }
  // camera
  G.cam.x += (S.px-VW/2-G.cam.x)*Math.min(1,dt*8);
  G.cam.y += (S.py-VH/2-G.cam.y)*Math.min(1,dt*8);
  // clock
  const dayLen=120, ph=(S.time%dayLen)/dayLen, day=Math.floor(S.time/dayLen)+1;
  $('dayLabel').textContent=day+'日目';
  $('phaseLabel').textContent= ph<0.25?'🌅 朝': ph<0.5?'☀️ 昼': ph<0.7?'🌇 夕': '🌙 夜';
  // autosave
  autosaveT+=dt; if(autosaveT>5){ autosaveT=0; save(); }
}

// ---------- render ----------
const BIO_COL={ water:'#274b6e', sand:'#cbb37a', grass:'#4e7a3a', forest:'#3d6230', rock:'#7c7f86' };
function render(){
  ctx.clearRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(-Math.round(G.cam.x), -Math.round(G.cam.y));
  const x0=Math.max(0,(G.cam.x/TILE|0)-1), y0=Math.max(0,(G.cam.y/TILE|0)-1);
  const x1=Math.min(WORLD-1,((G.cam.x+VW)/TILE|0)+1), y1=Math.min(WORLD-1,((G.cam.y+VH)/TILE|0)+1);
  // tiles
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const b=biomeAt(tx,ty); const px=tx*TILE,py=ty*TILE;
    let col=BIO_COL[b.t];
    // subtle shade by elevation
    const sh=(b.e-0.5)*22|0;
    ctx.fillStyle=shade(col,sh); ctx.fillRect(px,py,TILE+1,TILE+1);
    if(b.t==='water'){ ctx.fillStyle='rgba(255,255,255,'+(0.04+0.03*Math.sin((tx+ty)*0.7+S.time))+')'; ctx.fillRect(px,py,TILE,4); }
    else { // grass dots
      const d=hash2(tx,ty,S.seed+3); if(d<0.5){ ctx.fillStyle='rgba(0,0,0,.07)'; ctx.fillRect(px+(d*TILE|0)%TILE,py+((d*977|0)%TILE),3,3);} }
  }
  // nodes
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const nd=S.nodes[nodeKey(tx,ty)]; if(!nd||nd.amount<=0)continue;
    drawNode(tx,ty,nd);
  }
  // buildings
  for(const k in S.builds){ const [tx,ty]=k.split(',').map(Number);
    if(tx<x0-1||tx>x1+1||ty<y0-1||ty>y1+1)continue; drawBuild(tx,ty,S.builds[k]); }
  // placement ghost
  if(G.placeKey){ const def=BUILD_BY[G.placeKey];
    const tx=((S.px)/TILE|0), ty=((S.py)/TILE|0); // hint near player (purely visual ring)
  }
  // player
  drawPlayer();
  // gather range ring on nearest
  const nn=nearestNode();
  if(nn){ ctx.strokeStyle='rgba(255,230,120,.8)'; ctx.lineWidth=2; ctx.beginPath();
    ctx.arc(nn.cx,nn.cy,TILE*0.5,0,6.3); ctx.stroke(); }
  // particles & floaters
  for(const p of G.particles){ ctx.globalAlpha=clamp(p.life*2,0,1); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.3); ctx.fill(); }
  ctx.globalAlpha=1; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  for(const f of G.floaters){ ctx.globalAlpha=clamp(f.life,0,1);
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillText(f.txt,f.x+1,f.y+1); ctx.fillStyle=f.c; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;
  ctx.restore();
  // night overlay
  const ph=(S.time%120)/120; let dark=0;
  if(ph>0.5) dark=Math.min(0.5,(ph-0.5)/0.25*0.5); if(ph>0.75) dark=0.5-((ph-0.75)/0.25)*0.5;
  if(ph<0.2) dark=0.5-(ph/0.2)*0.5;
  if(dark>0.01){ ctx.fillStyle='rgba(10,16,40,'+dark+')'; ctx.fillRect(0,0,VW,VH); }
}
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255); return 'rgb('+r+','+g+','+b+')'; }
function drawNode(tx,ty,nd){
  const cx=tx*TILE+TILE/2, cy=ty*TILE+TILE/2, def=NODE[nd.type];
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(cx,cy+12,15,6,0,0,6.3); ctx.fill();
  if(def.draw==='tree'){
    ctx.fillStyle='#6b4a25'; ctx.fillRect(cx-3,cy+2,6,12);
    ctx.fillStyle='#2f5d22'; ctx.beginPath(); ctx.arc(cx,cy-4,15,0,6.3); ctx.fill();
    ctx.fillStyle='#3c7a2c'; ctx.beginPath(); ctx.arc(cx-5,cy-1,9,0,6.3); ctx.arc(cx+6,cy-2,8,0,6.3); ctx.fill();
  } else if(def.draw==='rock'){
    ctx.fillStyle='#8d949c'; ctx.beginPath(); ctx.moveTo(cx-13,cy+10); ctx.lineTo(cx-6,cy-9); ctx.lineTo(cx+4,cy-11);
    ctx.lineTo(cx+13,cy+2); ctx.lineTo(cx+9,cy+11); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#aeb4bb'; ctx.beginPath(); ctx.moveTo(cx-6,cy-9); ctx.lineTo(cx+4,cy-11); ctx.lineTo(cx,cy+1); ctx.closePath(); ctx.fill();
  } else { // ore
    ctx.fillStyle='#777'; ctx.beginPath(); ctx.moveTo(cx-13,cy+10); ctx.lineTo(cx-7,cy-8); ctx.lineTo(cx+5,cy-10);
    ctx.lineTo(cx+13,cy+3); ctx.lineTo(cx+8,cy+11); ctx.closePath(); ctx.fill();
    ctx.fillStyle=def.color; for(let i=0;i<5;i++){ const a=i*1.3; ctx.beginPath();
      ctx.arc(cx+Math.cos(a)*6, cy+Math.sin(a)*5-1, 3.2,0,6.3); ctx.fill(); }
    ctx.fillStyle=def.spot; ctx.beginPath(); ctx.arc(cx-2,cy-2,2,0,6.3); ctx.arc(cx+4,cy+3,1.6,0,6.3); ctx.fill();
  }
  ctx.restore();
}
function drawBuild(tx,ty,b){
  const def=BUILD_BY[b.key], px=tx*TILE,py=ty*TILE, cx=px+TILE/2,cy=py+TILE/2;
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(px+4,py+TILE-6,TILE-8,6);
  ctx.fillStyle=def.color; ctx.strokeStyle='#0006'; ctx.lineWidth=2;
  roundRect(px+4,py+4,TILE-8,TILE-8,7); ctx.fill(); ctx.stroke();
  ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(def.e,cx,cy+1);
  // active indicator
  if(b.active){ ctx.fillStyle='#7fff7f'; ctx.beginPath(); ctx.arc(px+TILE-9,py+9,3.5,0,6.3); ctx.fill(); }
  else if(!def.passive){ ctx.fillStyle='#e85'; ctx.beginPath(); ctx.arc(px+TILE-9,py+9,3.5,0,6.3); ctx.fill(); }
  ctx.textBaseline='alphabetic';
}
function drawPlayer(){
  const x=S.px,y=S.py;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x,y+11,11,5,0,0,6.3); ctx.fill();
  ctx.fillStyle='#e8c39e'; // body base
  ctx.beginPath(); ctx.arc(x,y,12,0,6.3); ctx.fillStyle='#3b78c2'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#cfe3ff'; ctx.stroke();
  ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🧑‍🌾',x,y); ctx.textBaseline='alphabetic';
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ---------- start / boot ----------
function beginRun(){ G.run=true; G.last=performance.now(); G.cam.x=S.px-VW/2; G.cam.y=S.py-VH/2;
  renderRes(); $('titleScreen').style.display='none'; requestAnimationFrame(loop); }
function startNew(){ S=freshState((Math.random()*1e9)|0); genWorld(); save(); beginRun(); toast('新しい世界へようこそ'); }
$('startBtn').onclick=startNew;
$('continueBtn').onclick=()=>{ const s=load(); if(s){ S=s; if(!S.crafted)S.crafted={}; beginRun(); } else startNew(); };
$('winContinue').onclick=()=>{ $('winScreen').style.display='none'; };
$('winReset').onclick=()=>{ $('winScreen').style.display='none'; startNew(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden && G.run) save(); });

// title boot
(function boot(){ const s=load(); if(s){ $('continueBtn').style.display='inline-block'; } })();
})();
</script>
